name: Web and API typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Vercel build command (apps/api root)
        run: |
          cd ../..
          npm run build -w @sousbot/shared
          npm run build -w @sousbot/web
          npm run build -w @sousbot/api
          node scripts/sync-web-to-api-public.mjs
          node scripts/sync-public-to-dist.mjs
          test -f apps/api/public/index.html
          test -f apps/api/dist/public/index.html
        working-directory: apps/api
